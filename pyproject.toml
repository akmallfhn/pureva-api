[project]
name = "pureva-api"
version = "0.1.0"
description = "Single backend Pureva: webhook WhatsApp Cloud API -> Postgres multitenant (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.30.0",
    # ZoneInfo butuh ini: Windows tidak punya tz database, image Linux slim juga sering tidak.
    "tzdata>=2024.1",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I"]

[project.scripts]
dev = "app.scripts:dev"
start = "app.scripts:start"
